<div
  [hidden]="question === null"
  class="container-fluid bg-body-secondary question-container rounded-2"
>
  <div class="row d-flex justify-content-between align-items-center mb-3">
    <p class="text-center text-md-start w-auto mb-0">
      {{ questions.length }}/{{ QuestionIndex + 1 }}
    </p>
  </div>
  <div class="row mb-4">
    <p class=" text-center text-md-start Text-font">
      {{ question.content }}
    </p>
  </div>
  <div
    class="row gap-1 gap-md-2 gap-lg-3 m-auto m-md-0 d-flex justify-content-evenly flex-wrap"
  >
    @for (option of question.options; track $index) {
    <button
      style="background-color: white"
      [ngClass]="{
        'text-bg-primary':
          (IsSelected && option.optionId === SelectedID) ||
          (option.optionId === SelectedID && QuestionIsFound)
      }"
      class="col-11 btn option-test Text-font rounded-3"
      (click)="select(option)"
    >
      {{ option.text }}
    </button>
    } @empty {
    <div class="d-flex justify-content-center align-items-center h-100">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    }
  </div>
  
  <div class="row mt-2 d-flex">
    <button
      (click)="back()"
      [disabled]="QuestionIndex == 0"
      class="col-3 bg-danger btn back-test rounded-3 Text-font"
    >
      <img
        src="../../../../../assets/svgviewer-output (6).svg"
        alt="back"
        class="img-thumbnail img-fluid button-icon"
      />
    </button>

    <button
      class="col-3 bg-primary btn next-test rounded-3 Text-font"
      (click)="next()"
      [disabled]="QuestionIndex == questions.length - 1"
    >
      <img
        src="../../../../../assets/svgviewer-output (5).svg"
        alt="next"
        class="img-thumbnail img-fluid button-icon"
      />
    </button>
    <!-- @defer (when IsSelected && IsEndQuestion) {
    <button
      (click)="endTest()"
      class="col-3 py-1 py-lg-2 btn btn-success end-test rounded-3 Text-font"
    >
      End Test
    </button>
    } -->
  </div>
</div>
