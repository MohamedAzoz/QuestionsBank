<div
  [hidden]="question === null"
  class="view container-fluid bg-body-secondary question-container rounded-2"
>
  <div class="row d-flex justify-content-between align-items-center mb-3">
    <p class="text-center text-md-start w-auto mb-0">
      {{ questions.length }}/{{ questions.indexOf(question) + 1 }}
    </p>
  </div>
  <div class="row mb-4">
    <p class="Text-font text-center text-md-start">
      {{ question.content }}
    </p>
  </div>
  <div
    class="row gap-1 gap-md-2 gap-lg-3 m-auto m-md-0 d-flex justify-content-evenly flex-wrap"
  >
    @for (option of question.options; track $index) {
    <button
      style="background-color: white"
      [ngClass]="{
        'text-bg-success':
          option.optionId == question.optionAswerId &&
          (IsTrue || IsNotCorrectOption),
        'text-bg-danger':
          SelectOptionId != question.optionAswerId &&
          option.optionId == SelectOptionId &&
          IsFalse
      }"
      [disabled]="IsSelected"
      class="col-11 col-md-5 btn option-test Text-font rounded-3"
      [id]="option.optionId"
      (click)="select(option)"
    >
      {{ option.text }}
    </button>
    } @empty {
    <div class="d-flex justify-content-center align-items-center h-100">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    }
  </div>
  <div class="row d-flex justify-content-center">
    @defer (when IsSelected) {
    <button
      (click)="next()"
      [hidden]="IsEndQuestion"
      [ngClass]="{ disabled: !IsSelected }"
      class="col-6 col-md-5 py-1 py-lg-2 btn next-test m-auto rounded-3 Text-font"
    >
      next
    </button>
    } @defer (when IsSelected && IsEndQuestion) {
    <button
      (click)="endTest()"
      class="col-6 col-md-5 py-1 py-lg-2 btn end-test m-auto rounded-3 Text-font"
    >
      End Test
    </button>
    }
  </div>
</div>
