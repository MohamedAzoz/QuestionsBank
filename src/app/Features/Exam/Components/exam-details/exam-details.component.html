<div
  class="container dis d-flex flex-column flex-md-row flex-wrap justify-content-evenly"
>
  @for (exam of exams; track $index) {
  <div class="col-8 col-lg-3">
    <a
      class="btn click"
      [routerLink]="['/subject', subjectId, 'exam', exam.id, questionId]"
      >{{ exam.name }}</a
    >
  </div>
  }
</div>
